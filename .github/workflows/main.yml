name: Password Expiry Autograding

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student submission
        uses: actions/checkout@v4

      - name: Install required Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y passwd

      - name: Check assignment files
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f -print

      - name: Run autograding tests
        run: |
          sudo bash tests/test_password_expiry.sh
